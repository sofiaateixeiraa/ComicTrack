name: comictrack
description: Gestão pessoal de coleções de comics.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  go_router: ^17.2.3

  dio: ^5.9.2

  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  google_sign_in: ^6.2.1

  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  fpdart: ^1.2.0

  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  flutter_dotenv: ^5.2.1

  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  image: ^4.3.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.5
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  json_serializable: ^6.7.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/brand/logo.png
    - assets/icons/logo-cover.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
